<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smart Agro AI - Aadhaar Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
  /* Base Setup */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    height: 100vh;
    /* High-quality Agri background with dark gradient overlay */
    background:
      linear-gradient(rgba(0, 0, 0, 0.45), rgba(10, 35, 10, 0.85)),
      url("https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&w=1600&q=80")
      no-repeat center center/cover;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: flex-start; /* Aligns to left like the home page */
    padding-left: 8%;
    color: white;
    overflow: hidden;
  }

  /* Glassmorphism Login Card */
  .login-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 50px 40px;
    border-radius: 25px;
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    animation: slideIn 1s ease-out;
  }

  .login-card h2 {
    font-size: 32px;
    color: #ffffff;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .subtitle {
    font-size: 14px;
    color: #a5d6a7;
    margin-bottom: 35px;
    opacity: 0.9;
  }

  /* Input Container Styling */
  .input-group {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255, 255, 255, 0.6);
    font-size: 18px;
  }

  input {
    width: 100%;
    padding: 15px 15px 15px 50px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
    color: white;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
  }

  input:focus {
    border-color: #81c784;
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 12px rgba(129, 199, 132, 0.3);
  }

  input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  /* Button Styling */
  .btn-submit {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 50px;
    background: #4caf50;
    color: white;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
  }

  .btn-submit:hover {
    background: #43a047;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
  }

  /* Success/Error Message */
  #message {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
    color: #c8e6c9;
    min-height: 20px;
  }

  .back-link {
    margin-top: 25px;
    display: block;
    text-align: center;
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
  }

  .back-link:hover {
    color: #81c784;
  }

  /* Entry Animation */
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    body { padding-left: 0; justify-content: center; }
    .login-card { width: 90%; }
  }
</style>
</head>
<body>

<div class="login-card">
  <h2>Aadhaar Login</h2>
  <p class="subtitle">Secure access for Smart Agro AI farmers</p>

  <form id="aadhaar-form">
    <div class="input-group">
      <i class="fa-solid fa-id-card"></i>
      <input 
        type="text" 
        id="aadhaar" 
        maxlength="12" 
        placeholder="12-digit Aadhaar Number" 
        required 
        inputmode="numeric" 
        autocomplete="off"
      />
    </div>
    <button type="submit" class="btn-submit">Request OTP</button>
  </form>

  <form id="otp-form" style="display:none;">
    <div class="input-group">
      <i class="fa-solid fa-shield-check"></i>
      <input 
        type="text" 
        id="otp" 
        maxlength="6" 
        placeholder="Enter 6-digit OTP" 
        required 
        inputmode="numeric" 
        autocomplete="off"
      />
    </div>
    <button type="submit" class="btn-submit">Verify & Sign In</button>
  </form>

  <p id="message" role="alert" aria-live="polite"></p>
  
  <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Return to Homepage</a>
</div>

<script>
$(document).ready(function(){
  const $message = $('#message');

  // Handle Aadhaar Submission
  $('#aadhaar-form').on('submit', function(e) {
    e.preventDefault();
    const val = $('#aadhaar').val().trim();
    
    if(/^\d{12}$/.test(val)) {
      $message.text("OTP has been sent to your mobile.").css('color', '#c8e6c9');
      $(this).fadeOut(300, function() {
        $('#otp-form').fadeIn(300);
        $('#otp').focus();
      });
    } else {
      $message.text("Please enter a valid 12-digit Aadhaar.").css('color', '#ff8a80');
    }
  });

  // Handle OTP Verification
  $('#otp-form').on('submit', function(e) {
    e.preventDefault();
    const val = $('#otp').val().trim();
    
    if(/^\d{6}$/.test(val)) {
      $message.text("Verification successful! Logging in...").css('color', '#81c784');
      setTimeout(() => {
        window.location.href = "index.html"; // Redirect after success
      }, 1500);
    } else {
      $message.text("Invalid OTP. Please enter 6 digits.").css('color', '#ff8a80');
    }
  });
});
</script>

</body>
</html>
